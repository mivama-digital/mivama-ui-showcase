# Reverse proxy for the password-protected Mivama UI showcase.
# The application container is bound to 127.0.0.1:8300 only.
server {
    listen 80;
    listen [::]:80;
    server_name ui.kamidzu.com;
    server_tokens off;

    return 301 https://ui.kamidzu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ui.kamidzu.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/kamidzu.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/kamidzu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    auth_basic "Mivama UI";
    auth_basic_user_file /etc/nginx/.htpasswd-landing;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
