name: mivama-ui-showcase

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mivama-ui-showcase:latest
    container_name: mivama-ui-showcase
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8300:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    cpus: "0.50"
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
